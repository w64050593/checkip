<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0f0a1f">
<title>后台登录 · 哈哈镜实验室</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
    min-height: 100vh; display: grid; place-items: center;
    background: radial-gradient(900px 500px at 30% 0%, #2a1a4a, #0f0a1f 60%, #050410);
    color: #f4f1ff; padding: 20px; padding-top: max(20px, env(safe-area-inset-top));
  }
  .wrap {
    width: 100%; max-width: 360px;
    background: rgba(255,255,255,.05); border: 1px solid rgba(255,255,255,.12);
    border-radius: 18px; padding: 30px 26px; box-shadow: 0 20px 60px rgba(0,0,0,.4);
  }
  .logo {
    width: 54px; height: 54px; border-radius: 16px; display: grid; place-items: center;
    font-size: 28px; margin: 0 auto 16px;
    background: conic-gradient(from 0deg,#ff5ea8,#ffd86b,#5ed0ff,#a78bff,#ff5ea8);
  }
  h1 { text-align: center; font-size: 20px; font-weight: 700; margin-bottom: 4px; }
  .sub { text-align: center; font-size: 12px; color: #b9a9e6; margin-bottom: 22px; }
  label { display: block; font-size: 12px; color: #c9bbe6; margin: 14px 0 6px; }
  input {
    width: 100%; font: inherit; font-size: 16px; padding: 13px 14px;
    border-radius: 12px; border: 1px solid rgba(255,255,255,.16);
    background: rgba(0,0,0,.25); color: #fff; outline: none;
  }
  input:focus { border-color: #a78bff; }
  button[type=submit] {
    width: 100%; margin-top: 22px; font: inherit; font-weight: 700; font-size: 16px; color: #fff;
    padding: 15px; border-radius: 12px; border: 0; cursor: pointer;
    background: linear-gradient(135deg,#7c5cff,#ff5ea8);
    box-shadow: 0 8px 30px rgba(167,139,255,.4); min-height: 50px;
  }
  button:disabled { opacity: .6; }
  .err { color: #ff8aa8; font-size: 13px; text-align: center; margin-top: 12px; min-height: 18px; }
  .back { display: block; text-align: center; margin-top: 18px; font-size: 12px; color: #b9a9e6; text-decoration: none; }
</style>
</head>
<body>
<div class="wrap">
  <div class="logo">🪞</div>
  <h1>后台登录</h1>
  <div class="sub">哈哈镜实验室 · 管理控制台</div>
  <form id="f" autocomplete="on">
    <label for="u">用户名</label>
    <input id="u" name="username" autocomplete="username" placeholder="请输入用户名">
    <label for="p">密码</label>
    <input id="p" name="password" type="password" autocomplete="current-password" placeholder="请输入密码">
    <button id="b" type="submit">登录</button>
    <div class="err" id="e"></div>
  </form>
  <a class="back" href="/">← 返回哈哈镜首页</a>
</div>
<script>
const f = document.getElementById("f"), e = document.getElementById("e"), b = document.getElementById("b");
f.addEventListener("submit", async (ev) => {
  ev.preventDefault();
  e.textContent = ""; b.disabled = true; b.textContent = "登录中…";
  try {
    const r = await fetch("/admin/login", {
      method: "POST",
      body: new URLSearchParams({
        username: document.getElementById("u").value,
        password: document.getElementById("p").value
      })
    });
    const j = await r.json().catch(() => ({}));
    if (r.ok && j.ok) {
      window.location.href = j.redirect || "/admin";
    } else {
      e.textContent = j.error || "登录失败";
      b.disabled = false; b.textContent = "登录";
    }
  } catch (err) {
    e.textContent = "网络错误，请重试";
    b.disabled = false; b.textContent = "登录";
  }
});
</script>
</body>
</html>
